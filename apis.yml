aid: neurable
name: Neurable
description: >-
  Neurable is a Boston, Massachusetts neurotechnology company, founded in 2015 on University of Michigan
  EEG signal-processing research, that builds non-invasive brain-computer interface (BCI) hardware and the
  AI models that interpret the signal. Its consumer product is the MW75 Neuro — Master & Dynamic over-ear
  headphones with dry conductive-fabric EEG electrodes that measure focus, fatigue and cognitive load — and
  it also ships an MW75 Neuro Research Kit (12-channel, 500 Hz raw EEG plus accelerometer/gyroscope, exported
  for LSL and BrainVision toolchains) and a partner Development Kit for hardware and software OEMs embedding
  Neurable sensing into their own devices. Neurable publishes no public developer portal or API reference,
  but its production backend services expose FastAPI-generated OpenAPI 3.1.0 descriptions at their host roots:
  an Analytics Service handling the EEG recording lifecycle and headset feature licensing, a real-time data
  processing pipe service that is also a full OpenID Connect authorization server, and a Brain Health Service.
