  detail: >-
    Contract discovery beat the marketing site. Neurable publishes no developer portal, but three
    production services serve FastAPI OpenAPI 3.1.0 documents anonymously at their host roots
    (analytics-service, pipe, report), and the pipe service is a live OpenID Connect provider with
    a public discovery document and JWKS. The hosts were found by certificate-transparency
    enumeration after api./developer./docs.neurable.com all failed to resolve.
